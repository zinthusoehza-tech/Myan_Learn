<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22c55e">
<link rel="manifest" href="/manifest.json">
<title>Nihongo Class</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@500;700&family=Padauk:wght@400;700&display=swap');
:root{
 --g:#22c55e;--gd:#15803d;--gl:#dcfce7;--bg:#f2f5f9;--c:#ffffff;--ink:#1c2333;--mu:#8b93a7;
 --pk:#fee2e2;--red:#ef4444;--gold:#f59e0b;--ln:#e7ebf2;--sh:0 8px 28px rgba(28,35,51,.07);--sh2:0 14px 40px rgba(28,35,51,.12)
}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--c:#191f2b;--ink:#edf1f7;--mu:#8b93a7;--pk:#3b2023;--gl:#13301f;--ln:#262e3e;--sh:0 8px 28px rgba(0,0,0,.35);--sh2:0 14px 40px rgba(0,0,0,.45)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Nunito,'Noto Sans JP',Padauk,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:110px}
.hide{display:none!important}
.hint{color:var(--mu);font-size:15px;line-height:1.5}
/* ---------- AUTH ---------- */
.auth{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:480px;margin:0 auto}
.auth .logo{font-size:80px;text-align:center;filter:drop-shadow(0 10px 20px rgba(34,197,94,.3))}
.auth h1{text-align:center;font-size:32px;font-weight:900;margin:6px 0 4px}
.auth p.s{text-align:center;color:var(--mu);margin-bottom:26px;font-weight:700}
.fg{margin-bottom:14px}.fg label{display:block;font-weight:800;font-size:13px;color:var(--mu);margin-bottom:6px;white-space:pre-line;letter-spacing:.3px}
.fg input,.fg select,.fg textarea{width:100%;padding:15px 17px;border:2px solid var(--ln);border-radius:16px;background:var(--c);font-size:17px;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--g);outline:none}
.fg textarea{font-family:'Noto Sans JP',Padauk,Nunito,sans-serif;line-height:1.55;resize:vertical}
.cta{display:block;width:100%;background:linear-gradient(#2fbf63,#1fa34e);color:#fff;font-weight:900;font-size:19px;padding:16px;border-radius:22px;box-shadow:0 8px 20px rgba(34,197,94,.35);transition:transform .1s}
.cta:active{transform:scale(.97)}.cta.sec{background:var(--c);color:var(--g);box-shadow:none;border:2px solid var(--ln)}
.cta.red{background:linear-gradient(#f2606a,#e33f4e);box-shadow:0 8px 20px rgba(239,68,68,.25)}
.sw{text-align:center;margin-top:18px;color:var(--mu);font-weight:700}.sw a{color:var(--g);font-weight:900;cursor:pointer}
/* ---------- HEADER / NAV ---------- */
.topbar{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:8px;padding:14px 16px 10px;background:linear-gradient(var(--bg) 75%,transparent);backdrop-filter:blur(8px)}
.tlogo{width:38px;height:38px;border-radius:13px;background:linear-gradient(#2fbf63,#1fa34e);display:grid;place-items:center;font-size:21px;box-shadow:0 6px 14px rgba(34,197,94,.35)}
.tname{flex:1;font-weight:900;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{background:var(--c);border-radius:20px;padding:7px 13px;font-weight:900;font-size:14px;box-shadow:var(--sh);white-space:nowrap}
nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;background:var(--c);border-radius:26px;display:flex;justify-content:space-around;padding:8px 6px;box-shadow:var(--sh2);z-index:10}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:900;color:var(--mu);padding:6px 10px;border-radius:18px;transition:color .15s}nav b{font-size:23px;filter:grayscale(1) opacity(.45)}
nav button.on{color:var(--g);background:var(--gl)}nav button.on b{filter:none}
.empty{margin:26px 18px;padding:34px 22px;background:var(--c);border-radius:24px;text-align:center;color:var(--mu);line-height:1.65;font-weight:600;box-shadow:var(--sh)}
/* ---------- LEARN PATH ---------- */
.vtop{padding:8px 20px 2px}.vtop h1{font-size:27px;font-weight:900}.vtop p{color:var(--mu);font-weight:700;font-size:14px;margin-top:2px}
.unit{margin:20px 16px 6px;background:linear-gradient(120deg,var(--gl),transparent);border:2px solid var(--gl);border-radius:20px;padding:15px 18px}
.unit h2{font-size:21px;font-weight:900}.unit small{color:var(--mu);font-weight:800}
.path{padding:8px 0 14px}
.nd{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;margin:13px 0;font-weight:900;text-align:center;font-size:13px;line-height:1.25;color:var(--ink)}
.nd .b{width:68px;height:68px;border-radius:24px;background:linear-gradient(#2fbf63,#1fa34e);border:4px solid #b9ecc9;display:grid;place-items:center;font-size:30px;position:relative;box-shadow:0 8px 18px rgba(34,197,94,.3);transition:transform .1s}
.nd.lock{color:var(--mu)}.nd.lock .b{background:#e8ebf2;border-color:transparent;box-shadow:none;filter:grayscale(1);opacity:.65}
.nd.done .b::after{content:"✓";position:absolute;right:-6px;top:-6px;background:var(--gold);color:#fff;width:26px;height:26px;border-radius:50%;font-size:14px;display:grid;place-items:center;font-weight:900;box-shadow:0 3px 8px rgba(245,158,11,.4)}
.nd:active .b{transform:scale(.93)}
/* ---------- CARDS ---------- */
.card{background:var(--c);border-radius:22px;padding:18px;margin:14px 16px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px}.row .grow{flex:1;min-width:0}
.row h3{font-size:18px;font-weight:900;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mu);font-weight:700;display:block}
.sm{padding:9px 16px;border-radius:16px;background:var(--g);color:#fff;font-weight:900;font-size:14px;white-space:nowrap}
.sm.o{background:var(--gl);color:var(--g)}.sm.r{background:var(--pk);color:var(--red)}
.tabs{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto}
.tabs button{padding:10px 18px;border-radius:18px;background:var(--c);font-weight:900;color:var(--mu);white-space:nowrap;box-shadow:var(--sh)}
.tabs button.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:14px 16px 0}
.kc{background:var(--c);border-radius:16px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:27px;font-weight:800;font-family:'Noto Sans JP',Padauk,sans-serif;box-shadow:var(--sh);transition:transform .1s}
.kc:active{transform:scale(.92)}.kc small{font-size:11px;color:var(--mu);font-family:Nunito;font-weight:800}.kc.e{background:none;box-shadow:none}
.search{width:calc(100% - 32px);margin:10px 16px;padding:14px 19px;border-radius:24px;border:0;background:var(--c);font-size:17px;box-shadow:var(--sh)}
.vid .th{height:190px;border-radius:18px;background:#222 center/cover;position:relative;margin-bottom:12px}
.vid .th::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:44px;text-shadow:0 2px 14px #000c}
.lv{display:inline-block;background:var(--gl);color:var(--g);padding:4px 13px;border-radius:13px;font-weight:900;font-size:13px;margin-top:8px}
/* ---------- PROFILE ---------- */
.prof{margin:16px;background:linear-gradient(135deg,#15803d,#22c55e);border-radius:26px;padding:22px;color:#fff;display:flex;gap:16px;align-items:center;box-shadow:0 12px 30px rgba(34,197,94,.35)}
.av{width:78px;height:78px;border-radius:26px;background:#ffffff33;border:3px solid #ffffff55;display:grid;place-items:center;font-size:42px;flex:none}
.prof h2{color:#fef9c3;font-size:23px;font-weight:900}.prof p{font-size:15px;font-weight:700;opacity:.95}
.streak{margin:14px 16px;background:linear-gradient(135deg,#f59e0b,#f97316);border-radius:22px;padding:18px 20px;color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 10px 26px rgba(249,115,22,.3)}
.streak .fl{font-size:40px}.streak b{font-size:22px;font-weight:900}.streak small{font-weight:700;opacity:.95}
.stats{display:flex;margin:14px 16px;background:var(--c);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.stats div{flex:1;text-align:center}.stats b{display:block;font-size:24px;font-weight:900}.stats span{color:var(--mu);font-size:13px;font-weight:800}
.lvbar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:9px}.lvbar b{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#86efac);border-radius:6px}
.wk{margin:14px 16px;background:linear-gradient(135deg,#16a34a,#4ade80);border-radius:24px;padding:20px;color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.25)}
.wk h3{margin-bottom:16px;font-weight:900}
.bars{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;flex:1}
.bars i{display:block;width:16px;height:120px;border-radius:8px;background:#ffffff40;position:relative;overflow:hidden}
.bars i b{position:absolute;bottom:0;left:0;right:0;background:#fef08a;border-radius:8px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.bdg{background:var(--bg);border-radius:18px;padding:14px 8px;text-align:center}
.bdg span{font-size:30px}.bdg small{display:block;font-size:12px;font-weight:900;margin-top:4px}
.bdg.off{opacity:.4;filter:grayscale(1)}
.rv{display:flex;align-items:center;gap:16px}
.rvnum{font-size:44px;font-weight:900;color:var(--g);min-width:64px;text-align:center;background:var(--gl);border-radius:20px;padding:12px 0}
/* ---------- SHEETS ---------- */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;max-width:480px;margin:0 auto}
.sheet.on{display:flex}#sheet2{z-index:40}
.sh{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--c);border-bottom:2px solid var(--ln)}
.sh h2{flex:1;font-size:20px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--mu);font-size:18px;font-weight:900;flex:none}
.pb{flex:1;height:12px;background:var(--ln);border-radius:8px;overflow:hidden}
.pb b{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#86efac);border-radius:8px;transition:width .3s}
.sc{flex:1;overflow-y:auto;padding:16px 16px 130px}
.sc h3.t{font-size:22px;font-weight:900;margin:4px 0 12px}
.ft{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:auto}
.vc{background:var(--c);border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh)}
.vc .r{display:flex;align-items:baseline;gap:8px}
.vc .jp{font-size:25px;font-weight:800;font-family:'Noto Sans JP',Padauk,sans-serif}
.vc .ro{color:var(--mu);font-weight:700}
.vc .r button{margin-left:auto;font-size:22px}
.vc p{font-size:18px;margin-top:5px;font-weight:600}
.vact{display:flex;gap:8px;margin-top:12px}
.tag{padding:7px 13px;border-radius:14px;background:var(--bg);color:var(--mu);font-weight:900;font-size:13px}
.tag.on{background:var(--gl);color:var(--g)}
.notes{background:var(--c);border-radius:22px;padding:22px;line-height:1.75;white-space:pre-wrap;font-size:18px;box-shadow:var(--sh);font-weight:600}
.imgs{display:grid;gap:12px;margin-top:14px}
.imgs img{width:100%;border-radius:18px;display:block;box-shadow:var(--sh)}
/* ---------- QUIZ ---------- */
.qw{text-align:center;padding-top:14px}
.qw h3{font-size:19px;font-weight:900}
.qbig{font-size:52px;font-weight:800;margin:22px 0 6px;font-family:'Noto Sans JP',Padauk,sans-serif;line-height:1.2}
.qro{color:var(--mu);margin-bottom:22px;font-size:19px;min-height:14px;font-weight:700}
.opt{display:block;width:100%;background:var(--c);border:3px solid var(--ln);border-radius:18px;padding:16px;font-size:19px;font-weight:800;margin-bottom:12px;font-family:'Noto Sans JP',Padauk,Nunito,sans-serif;box-shadow:var(--sh);text-align:left;transition:border-color .15s}
.opt.ok{border-color:var(--g);background:var(--gl)}.opt.no{border-color:var(--red);background:var(--pk)}
.tin{width:100%;padding:15px 17px;border:3px solid var(--ln);border-radius:16px;background:var(--c);font-size:21px;text-align:center;font-weight:800}
.tin:focus{border-color:var(--g);outline:none}
.bigplay{width:104px;height:104px;border-radius:50%;background:linear-gradient(#2fbf63,#1fa34e);color:#fff;font-size:46px;margin:22px auto;display:grid;place-items:center;box-shadow:0 12px 26px rgba(34,197,94,.4)}
.bigplay:active{transform:scale(.93)}
.res{text-align:center;padding:56px 10px;font-size:26px;font-weight:900}
.res div{font-size:84px}.res small{display:block;color:var(--mu);font-size:17px;margin-top:8px;font-weight:700}
/* ---------- FLASHCARD DECK ---------- */
.deckwrap{display:grid;place-items:center;padding:16px 0 4px}
.deck{perspective:1100px;width:100%;max-width:320px;aspect-ratio:3/3.6;cursor:pointer}
.dcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.3,1.1)}
.dcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;box-shadow:var(--sh2)}
.face.fo{background:var(--c)}
.face.fo .jp{font-size:52px;font-weight:800;font-family:'Noto Sans JP',Padauk,sans-serif}
.face.fo small{color:var(--mu);font-weight:800}
.face.ba{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;transform:rotateY(180deg)}
.face.ba p{font-size:23px;font-weight:900;text-align:center;line-height:1.4}
.face.ba small{font-weight:800;opacity:.9}
/* ---------- MISC ---------- */
.ld{position:fixed;inset:0;background:#0008;z-index:99;display:grid;place-items:center;opacity:0;pointer-events:none}
.ld.on{opacity:1;pointer-events:auto;transition:opacity .2s .35s}
.ld i{width:44px;height:44px;border:5px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#222e;color:#fff;padding:12px 20px;border-radius:24px;font-weight:800;z-index:100;max-width:88%;text-align:center;box-shadow:var(--sh2)}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000}
select{background:var(--c)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<base target="_blank">
</head>
<body>
<div id="authv" class="auth hide">
  <div class="logo">🦊</div><h1>Nihongo Class</h1><p class="s">Learn a language, one lesson a day</p>
  <div class="fg hide" id="rn">
    <label>Your name</label><input id="aname" autocomplete="name">
    <label style="margin-top:12px">Language you want to learn</label>
    <select id="alang">
      <option value="ja">🇯🇵 Japanese</option>
      <option value="ko">🇰🇷 Korean</option>
      <option value="my">🇲🇲 Myanmar</option>
    </select>
  </div>
  <div class="fg"><label>Username</label><input id="auser" autocapitalize="none" autocomplete="username"></div>
  <div class="fg"><label>Password</label><input id="apass" type="password" autocomplete="current-password"></div>
  <button class="cta" id="abtn">Log in</button>
  <p class="sw" id="asw">New student? <a data-a="authmode">Create account</a></p>
</div>
<div id="app" class="hide">
  <header id="hd"></header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div class="sheet" id="sheet"></div>
<div class="sheet" id="sheet2"></div>
<div class="ld" id="ld"><i></i></div>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={user:null,units:[],lessons:[],videos:[],classes:[],prog:[],tab:'learn'};
const LANGS={ja:{n:'Japanese',f:'🇯🇵',tts:'ja-JP'},ko:{n:'Korean',f:'🇰🇷',tts:'ko-KR'},my:{n:'Myanmar',f:'🇲🇲',tts:'my-MM'}};
const lang=()=>(S.user&&LANGS[S.user.lang])?S.user.lang:'ja';
const staff=()=>S.user&&(S.user.role==='teacher'||S.user.isAdmin);
const admin=()=>!!(S.user&&S.user.isAdmin);
const toast=m=>{document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};
let busy=0;
async function api(action,body={}){
  busy++;$('ld').classList.add('on');
  try{const r=await fetch('/api/index.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,action,username:body.username??S.user?.username})});
    const j=await r.json();if(j.logout)logout();return j}
  catch(e){return{success:false,error:'No internet connection'}}
  finally{if(--busy<=0)$('ld').classList.remove('on')}
}
const speak=(t,l)=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l||LANGS[lang()].tts;u.rate=.9;speechSynthesis.speak(u)}catch(e){}};
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const parseVocab=t=>String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s*[|\t]\s*/);return p.length===2?{jp:p[0],ro:'',m:p[1]}:{jp:p[0],ro:p[1]||'',m:p.slice(2).join(' | ')}}).filter(w=>w.jp&&w.m);
const ytId=u=>(String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1];
// Convert a Google Drive share link into a direct-viewable image URL
const driveImg=u=>{const m=String(u).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^"']*?id=)([\w-]{10,})/);return m?`https://lh3.googleusercontent.com/d/${m[1]}=w1200`:u};
const allVocab=()=>S.lessons.flatMap(l=>parseVocab(l.vocab));
const doneSet=()=>new Set(S.prog.filter(p=>p.passed).map(p=>p.lessonId));
const isoDay=d=>new Date(d).toISOString().slice(0,10);
function streak(){const days=new Set(S.prog.filter(p=>p.passed).map(p=>p.day));let n=0;const d=new Date();if(!days.has(isoDay(d)))d.setDate(d.getDate()-1);while(days.has(isoDay(d))){n++;d.setDate(d.getDate()-1)}return n}
// weak-word review deck (stored on device per user)
const wkey=()=>'nk_weak_'+(S.user?S.user.username:'x');
const getWeak=()=>{try{return JSON.parse(localStorage.getItem(wkey())||'[]')}catch(e){return[]}};
const saveWeak=a=>localStorage.setItem(wkey(),JSON.stringify(a.slice(0,300)));
const addWeak=w=>{const a=getWeak();if(!a.some(x=>x.jp===w.jp&&x.m===w.m)){a.push(w);saveWeak(a)}};
const delWeak=w=>saveWeak(getWeak().filter(x=>!(x.jp===w.jp&&x.m===w.m)));

/* ---------- ALPHABET DATA (per language) ---------- */
const mk=s=>s.split(',').map(x=>{if(x.trim()==='_')return null;const p=x.trim().split(/\s+/);return[p[0],p.slice(1).join(' ')]});
const KANA=mk('あ a,い i,う u,え e,お o,か ka,き ki,く ku,け ke,こ ko,さ sa,し shi,す su,せ se,そ so,た ta,ち chi,つ tsu,て te,と to,な na,に ni,ぬ nu,ね ne,の no,は ha,ひ hi,ふ fu,へ he,ほ ho,ま ma,み mi,む mu,め me,も mo,や ya,_,ゆ yu,_,よ yo,ら ra,り ri,る ru,れ re,ろ ro,わ wa,_,_,_,を wo,ん n');
const KO_C=mk('ㄱ g,ㄲ kk,ㄴ n,ㄷ d,ㄸ tt,ㄹ r,ㅁ m,ㅂ b,ㅃ pp,ㅅ s,ㅆ ss,ㅇ ng,ㅈ j,ㅉ jj,ㅊ ch,ㅋ k,ㅌ t,ㅍ p,ㅎ h');
const KO_V=mk('ㅏ a,ㅑ ya,ㅓ eo,ㅕ yeo,ㅗ o,ㅛ yo,ㅜ u,ㅠ yu,ㅡ eu,ㅣ i');
const MY_C=mk('က ka,ခ hka,ဂ ga,ဃ ga,င nga,စ sa,ဆ hsa,ဇ za,ဈ za,ည nya,ဋ ta,ဌ hta,ဍ da,ဎ da,ဏ na,တ ta,ထ hta,ဒ da,ဓ da,န na,ပ pa,ဖ hpa,ဗ ba,ဘ ba,မ ma,ယ ya,ရ ya,လ la,ဝ wa,သ tha,ဟ ha,ဠ la,အ a');
let ksub='h';

/* ---------- LEARN ---------- */
function vLearn(){
  const done=doneSet();let prev=true;
  let h=vtop('Learning',`${LANGS[lang()].f} ${LANGS[lang()].n} course`);
  if(!S.units.length)return h+`<div class="empty">${staff()?'No lessons yet.<br>Go to <b>Me → Teacher tools</b> and add your first unit and lesson.':'Your teacher has not added lessons yet.<br>Check back soon!'}</div>`;
  const pos=[50,20,50,80];

    h+=`<div class="unit"><h2>${esc(u.title)}</h2><small>${n}/${ls.length} lessons</small></div><div class="path">`;

let L,words=[],qs=[],qi=0,score=0,lock=0,quizKind='lesson';
const sheet=(h,id='sheet')=>{$(id).innerHTML=h;$(id).classList.add('on')};
const closeSheet=(id='sheet')=>$(id).classList.remove('on');
const ph=p=>`<div class="sh"><button class="x" data-a="close" aria-label="Close">✕</button><div class="pb"><b style="width:${p}%"></b></div></div>`;
const lessonImgs=l=>String(l.images||'').split('\n').map(x=>x.trim()).filter(Boolean);
function openLesson(id){
  const l=S.lessons.find(x=>x.id===id),sib=S.lessons.filter(x=>x.unitId===l.unitId),k=sib.indexOf(l);
  if(!staff()&&k>0&&!doneSet().has(sib[k-1].id))return toast('Finish the previous lesson first');
  L=l;words=parseVocab(l.vocab);if(!words.length)return toast('This lesson has no vocabulary yet');step('vocab');
}
function step(s){
  if(s==='vocab')sheet(ph(12)+`<div class="sc"><h3 class="t">👉 ${esc(L.title)}</h3><p class="hint" style="margin-bottom:14px">Tap 🔊 to listen. Mark tricky words with 🔁 to review them later.</p>${words.map((w,i)=>`<div class="vc"><div class="r"><span class="jp">${esc(w.jp)}</span>${w.ro?`<span class="ro">${esc(w.ro)}</span>`:''}<button data-a="say" data-v="${i}" aria-label="Listen">🔊</button></div><p>${esc(w.m)}</p><div class="vact"><button class="tag" data-a="know" data-v="${i}">😊 Got it</button><button class="tag" data-a="rere" data-v="${i}">🔁 Review</button></div></div>`).join('')}</div><button class="cta ft" data-a="${L.notes||lessonImgs(L).length?'notes':'quiz'}">Next</button>`);
  if(s==='notes'){
    const im=lessonImgs(L).map(driveImg);
    sheet(ph(36)+`<div class="sc"><h3 class="t">Grammar & notes</h3>${L.notes?`<div class="notes">${esc(L.notes)}</div>`:''}${im.length?`<div class="imgs">${im.map(u=>`<img src="${esc(u)}" loading="lazy" alt="lesson picture">`).join('')}</div>`:''}</div><button class="cta ft" data-a="quiz">Start practice</button>`);
  }
}
/* ---------- QUIZ ---------- */
function startQuiz(kind='lesson'){
  quizKind=kind;
  const list=kind==='review'?getWeak():words,pool=allVocab();
  qs=shuffle(list).slice(0,kind==='review'?8:10).map((w,i)=>{
    const type=(kind==='lesson'&&w.ro&&i%4===3)?'type':['read','rev','listen'][i%3];
    const rev=type==='rev',key=rev?'jp':'m',seen=new Set([w[key]]),opts=[w];
    shuffle(pool).forEach(x=>{if(opts.length<4&&!seen.has(x[key])&&x.jp&&x.m){seen.add(x[key]);opts.push(x)}});
    return{w,type,rev,opts:shuffle(opts)};
  }).filter(q=>q.opts.length>=2);
  if(!qs.length)return toast('Not enough words yet');
  qi=0;score=0;lock=0;drawQ();
}
function drawQ(){
  const q=qs[qi];let body='';
  if(q.type==='type'){
    body=`<div class="qw"><h3>Type the romaji</h3><div class="qbig" style="font-size:32px">${esc(q.w.m)}</div><input id="tans" class="tin" placeholder="type here…" autocomplete="off" autocapitalize="off"><button class="cta" data-a="check" style="margin-top:14px">Check</button><div id="tfb" style="margin-top:14px;font-weight:900;font-size:19px;min-height:26px"></div></div>`;
  }else{
    const big=q.rev?esc(q.w.m):esc(q.w.jp);
    body=`<div class="qw"><h3>${q.rev?'Choose the Japanese':q.type==='listen'?'Listen and choose the meaning':'What does this mean?'}</h3>${q.type==='listen'?`<button class="bigplay" data-a="hear" aria-label="Listen">🔊</button>`:`<div class="qbig">${big}</div>`}${q.type==='listen'?'<div class="qro">tap the speaker to play</div>':''}${!q.rev&&q.w.ro?`<div class="qro">${esc(q.w.ro)}</div>`:''}<div style="margin-top:16px">${q.opts.map((o,i)=>`<button class="opt" data-a="ans" data-v="${i}">${esc(q.rev?o.jp:o.m)}</button>`).join('')}</div></div>`;
  }
  sheet(ph(30+qi/qs.length*70)+`<div class="sc">${body}</div>`);
  if(q.type==='listen')setTimeout(()=>speak(q.w.jp),250);
  if(q.type==='type'){const t=$('tans');setTimeout(()=>t.focus(),300);t.addEventListener('keydown',e=>{if(e.key==='Enter')A.check()})}
}
function nextQ(){qi++;lock=0;qi<qs.length?drawQ():finish()}
async function finish(){
  if(quizKind==='review'){
    sheet(`<div class="sh"><button class="x" data-a="close">✕</button><h2>Review done</h2></div><div class="sc"><div class="res"><div>${score>=Math.ceil(qs.length/2)?'🎉':'💪'}</div>${score}/${qs.length} correct<small>${getWeak().length} words left in your review deck</small></div></div><button class="cta ft" data-a="close">Done</button>`);
    render();return;
  }
  const r=await api('complete',{lessonId:L.id,correct:score,total:qs.length});
  const ok=r.success&&r.passed;
  sheet(`<div class="sh"><button class="x" data-a="close">✕</button><h2>Result</h2></div><div class="sc"><div class="res"><div>${ok?'🎉':'💪'}</div>${score}/${qs.length} correct<small>${r.success?(r.exp?`+${r.exp} exp earned`:'Practice only — lesson already completed 🎯'):esc(r.error)}</small><small>${ok?'Lesson complete!':'Score 60% or more to finish. Try again!'}</small></div></div><button class="cta ft" data-a="${ok?'close':'quiz'}">${ok?'Continue':'Try again'}</button>`);
  load();
}

  lesson:{t:'Lesson',c:'lessons',f:[['unitId','Unit','unit'],['title','Lesson title'],['order','Order (1, 2, 3…)','number'],['lang','Language','langsel'],['vocab','Vocabulary — one word per line:\n日本語 | romaji | meaning\n(you can paste from Excel / Google Sheets)','area'],['notes','Grammar / notes (optional)','area'],['images','Pictures — Google Drive share links, one per line (optional)','area']]},
  video:{t:'Video',c:'videos',f:[['title','Title'],['url','YouTube link'],['level','Level','level'],['lang','Language','langsel']]},

};

async function users(){

function fld([n,l,t],v){v=v??'';let i;
  if(t==='area')i=`<textarea id="f_${n}" rows="${n==='vocab'?9:3}" placeholder="${n==='vocab'?'こんにちは | konnichiwa | Hello\nさようなら | sayounara | Goodbye':''}">${esc(v)}</textarea>`;
  else if(t==='unit')i=`<select id="f_${n}">${S.units.map(u=>`<option value="${u.id}" ${u.id===v?'selected':''}>${esc(u.title)}</option>`).join('')}</select>`;
  else if(t==='level')i=`<select id="f_${n}">${['Easy','Medium','Hard'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
  else if(t==='langsel')i=`<select id="f_${n}">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===(v||lang())?'selected':''}>${v.f} ${v.n}</option>`).join('')}</select>`;
  else i=`<input id="f_${n}" type="${t||'text'}" value="${esc(v)}">`;
  return`<div class="fg"><label>${l}</label>${i}</div>`}
function form(kind,id){
  const F=FORMS[kind];if(kind==='lesson'&&!S.units.length)return toast('Add a unit first');
  editing=id?S[F.c].find(x=>x.id===id):null;const e={...(editing||{})};
  if(!id&&kind==='lesson')e.order=S.lessons.length+1;if(!id&&kind==='unit')e.order=S.units.length+1;
  sheet(`<div class="sh"><button class="x" data-a="close2">✕</button><h2>${id?'Edit':'New'} ${F.t.toLowerCase()}</h2></div><div class="sc">${F.f.map(f=>fld(f,e[f[0]])).join('')}</div><button class="cta ft" data-a="save" data-v="${kind}">Save</button>`,'sheet2');
}
async function save(kind){
  const d={};FORMS[kind].f.forEach(([n])=>d[n]=$('f_'+n).value);if(editing)d.id=editing.id;
  if(!d.title.trim())return toast('Please enter a title');
  if(kind==='lesson'&&!parseVocab(d.vocab).length)return toast('Add at least one word: 日本語 | romaji | meaning');
  if(kind==='video'&&!ytId(d.url))return toast('Paste a valid YouTube link');
  const r=await api('save',{kind,data:d});if(!r.success)return toast(r.error);
  closeSheet('sheet2');await load();TT=kind;tools();toast('Saved ✓');
}
function addUser(){
  sheet(`<div class="sh"><button class="x" data-a="close2">✕</button><h2>New student account</h2></div><div class="sc">
  <div class="fg"><label>Username (3-20 letters/numbers)</label><input id="nu_user" autocapitalize="none"></div>
  <div class="fg"><label>Password (min 4 characters)</label><input id="nu_pass"></div>
  <div class="fg"><label>Display name</label><input id="nu_name"></div>
  <div class="fg"><label>Role</label><select id="nu_role"><option value="student">Student</option><option value="teacher">Teacher</option></select></div>
  <div class="fg"><label>Language</label><select id="nu_lang"><option value="ja">🇯🇵 Japanese</option><option value="ko">🇰🇷 Korean</option><option value="my">🇲🇲 Myanmar</option></select></div></div>
  <button class="cta ft" data-a="saveuser">Create account</button>`,'sheet2');
}
async function saveUser(){
  const r=await api('adminCreateUser',{username:$('nu_user').value.trim(),password:$('nu_pass').value,displayName:$('nu_name').value.trim(),role:$('nu_role').value,lang:$('nu_lang').value});
  if(!r.success)return toast(r.error);
  closeSheet('sheet2');toast('Account created ✓');users();
}

/* ---------- ACTIONS ---------- */
const A={
  auth:async()=>{const u=$('auser').value.trim(),p=$('apass').value;if(!u||!p)return toast('Enter username and password');
    const r=await api(reg?'register':'login',{username:u,password:p,displayName:$('aname').value.trim()||u,lang:$('alang').value});
    if(!r.success)return toast(r.error);S.user=r.user;await load()},
  authmode:()=>{reg=!reg;$('rn').classList.toggle('hide',!reg);$('abtn').textContent=reg?'Create account':'Log in';$('asw').innerHTML=reg?'Have an account? <a data-a="authmode">Log in</a>':'New student? <a data-a="authmode">Create account</a>'},
  tab:v=>{S.tab=v;render();scrollTo(0,0)},km:v=>{ksub=v;render()},
  say2:(v,el)=>speak(v,el.dataset.l),say:v=>speak(words[v].jp),
  open:v=>openLesson(v),notes:()=>step('notes'),quiz:()=>startQuiz('lesson'),quizreview:()=>startQuiz('review'),
  deck:()=>startDeck(),flip:()=>{const d=$('dk');if(d)d.querySelector('.dcard').classList.toggle('flip')},
  dsay:()=>speak(deck[di].jp),dknow:()=>{delWeak(deck[di]);deckNext()},dagain:()=>{addWeak(deck[di]);deckNext()},
  know:(v,el)=>{delWeak(words[v]);el.classList.add('on');el.textContent='😊 Got it ✓'},
  rere:(v,el)=>{addWeak(words[v]);el.classList.add('on');el.textContent='🔁 In review deck ✓'},
  hear:()=>speak(qs[qi].w.jp),
  ans:(v,el)=>{if(lock)return;lock=1;const q=qs[qi],ok=q.opts[v]===q.w;if(ok)score++;else addWeak(q.w);
    el.classList.add(ok?'ok':'no');if(!ok)document.querySelector(`.opt[data-v="${q.opts.indexOf(q.w)}"]`).classList.add('ok');speak(q.w.jp);
    setTimeout(nextQ,1100)},
  check:()=>{if(lock)return;const q=qs[qi],t=$('tans'),norm=s=>String(s).toLowerCase().replace(/[\s\-'.\u2019]/g,'');
    const ok=norm(t.value)&&norm(t.value)===norm(q.w.ro)||norm(t.value)===norm(q.w.jp);
    $('tfb').style.color=ok?'var(--g)':'var(--red)';$('tfb').innerHTML=ok?'✅ Correct!':`❌ Answer: <b>${esc(q.w.ro||q.w.jp)}</b>`;
    if(ok)score++;else addWeak(q.w);lock=1;speak(q.w.jp);setTimeout(nextQ,1300)},
  close:()=>closeSheet(),close2:()=>closeSheet('sheet2'),
  vid:v=>{const x=S.videos.find(i=>i.id===v),id=ytId(x.url);sheet(`<div class="sh"><button class="x" data-a="close">✕</button><h2>${esc(x.title)}</h2></div><div class="sc"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`)},
  tools:()=>tools(),tt:v=>{TT=v;tools()},form:(v,el)=>form(v,el.dataset.id),save:v=>save(v),
  adduser:()=>addUser(),saveuser:()=>saveUser(),
  del:async(v,el)=>{if(!confirm('Delete this '+FORMS[v].t.toLowerCase()+'?'+(v==='unit'?' All its lessons will be deleted too.':'')))return;
    const r=await api('del',{kind:v,id:el.dataset.id});if(!r.success)return toast(r.error);await load();tools()},
  uact:async(v,el)=>{const t=el.dataset.u;let r;
    if(v==='role')r=await api('adminSetRole',{target:t,role:el.dataset.r});
    if(v==='ban')r=await api('adminToggleBan',{target:t,isBanned:!!el.dataset.b});
    if(v==='pw'){const p=prompt('New password for @'+t+' (min 4 characters)');if(!p)return;r=await api('adminResetPassword',{target:t,password:p});if(r.success)toast('Password changed')}
    if(v==='del'){if(!confirm('Delete @'+t+' and all progress?'))return;r=await api('adminDeleteUser',{target:t})}
    if(!r.success)return toast(r.error);users()},
  savelang:async()=>{await api('updateProfile',{lang:$('langsel').value});toast('Language updated 🌐');load()},
  rename:async()=>{const n=prompt('Your name',S.user.displayName);if(!n)return;await api('updateProfile',{displayName:n});load()},
  install:()=>{if(deferred){deferred.prompt();deferred=null}},logout
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){e.preventDefault();A[t.dataset.a](t.dataset.v,t)}});
document.addEventListener('input',e=>{if(e.target.id==='vs'){vq=e.target.value;$('vl').innerHTML=vList()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('authv').classList.contains('hide'))A.auth()});
let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=$('inst');if(b)b.classList.remove('hide')});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
const saved=localStorage.getItem('nk_user');
if(saved){S.user={username:saved};load().then(ok=>{if(!ok)showAuth()})}else showAuth();
</script>
</body>
</html>
