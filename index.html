<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Myan Learn</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  
  :root {
    --primary: #58CC02; --primary-hover: #46A302; --primary-light: #89E219;
    --bg: #FFFFFF; --surface: #F7F7F7; --text: #3C3C3C; --text-muted: #AFAFAF;
    --border: #E5E5E5; --radius: 16px;
    --shadow: 0 2px 0 #E5E5E5;
  }
  body.dark {
    --bg: #131F24; --surface: #202F36; --text: #F1F7FB; --text-muted: #8A9CA6;
    --border: #37464F; --shadow: 0 2px 0 #0F171A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Padauk', 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; font-weight: 600; }
  
  .icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: middle; }
  .icon-sm { width: 18px; height: 18px; }
  .btn { padding: 12px 20px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-muted); }
  .btn-glass { background: var(--surface); color: var(--text); border: 2px solid var(--border); box-shadow: var(--shadow); }
  
  /* Forms */
  .input-group { margin-bottom: 1rem; }
  .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
  .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 0.9rem; border: 2px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); outline: none; font-size: 0.95rem; font-weight: 500; transition: 0.2s; }
  .input-group input:focus { border-color: var(--primary); }

  /* Loading */
  #loadingOverlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(4px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; opacity: 0; transition: 0.3s; }
  body.dark #loadingOverlay { background: rgba(19, 31, 36, 0.8); }
  #loadingOverlay.show { display: flex; opacity: 1; }
  .loader-bar-container { width: 200px; height: 12px; background: var(--border); border-radius: 10px; overflow: hidden; margin-top: 1rem; }
  .loader-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease; border-radius: 10px; }

  /* Auth Screen */
  #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
  .auth-box { width: 100%; max-width: 400px; padding: 2.5rem 2rem; border-radius: 24px; text-align: center; background: var(--bg); border: 2px solid var(--border); box-shadow: var(--shadow); }
  
  /* Main Layout */
  #app { display: none; flex-direction: column; max-width: 800px; margin: 0 auto; padding-bottom: 80px; min-height: 100vh; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem; position: sticky; top: 0; background: var(--bg); z-index: 40; border-bottom: 2px solid var(--border); }
  .app-view { padding: 1rem; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Path UI */
  .path-container { display: flex; flex-direction: column; align-items: center; padding: 2rem 0; position: relative; }
  .path-node { width: 70px; height: 70px; border-radius: 50%; background: var(--surface); border: 4px solid var(--border); display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; z-index: 2; transition: 0.2s; margin: 1.5rem 0; box-shadow: 0 4px 0 var(--border); }
  .path-node.active { background: var(--primary); border-color: var(--primary-hover); box-shadow: 0 4px 0 var(--primary-hover); color: white; }
  .path-node.locked { opacity: 0.6; cursor: not-allowed; }
  .path-node.diamond { border-radius: 16px; transform: rotate(45deg); }
  .path-node.diamond svg { transform: rotate(-45deg); }
  .path-node .node-label { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-weight: 800; color: var(--text-muted); font-size: 0.9rem; white-space: nowrap; }
  .path-node.active .node-label { color: var(--text); }
  .path-line { width: 4px; height: 40px; background: var(--border); margin: -0.5rem 0; z-index: 1; }
  
  /* Tree Layout */
  .path-row { display: flex; width: 100%; justify-content: center; gap: 40px; }
  .path-row:nth-child(even) { transform: translateX(-40px); }
  .path-row:nth-child(odd) { transform: translateX(40px); }

  /* Theory/Flashcard UI */
  .theory-container { max-width: 600px; margin: 0 auto; }
  .flashcard { background: var(--surface); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; border: 2px solid var(--border); box-shadow: 0 2px 0 var(--border); }
  .fc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
  .fc-word { font-size: 1.4rem; font-weight: 800; }
  .fc-romaji { font-size: 1rem; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
  .fc-meaning { font-size: 1.1rem; margin-top: 0.5rem; }
  .fc-actions { display: flex; gap: 10px; color: var(--text-muted); }
  .fc-note { margin-top: 1rem; padding-top: 1rem; border-top: 2px solid var(--border); display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; }
  
  /* Intro (Article) UI */
  .intro-card { background: var(--surface); border-radius: 16px; padding: 2rem; border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }
  .intro-title { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 1rem; }
  .intro-example { text-align: center; font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1.5rem; }
  .intro-img { width: 100%; max-height: 250px; object-fit: contain; margin-bottom: 1.5rem; border-radius: 12px; }
  .intro-text { font-size: 1rem; line-height: 1.6; color: var(--text); margin-bottom: 1rem; }
  .intro-list { margin-left: 1.5rem; margin-bottom: 1rem; line-height: 1.6; }

  /* Modals */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s; }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--bg); width: 90%; max-width: 500px; padding: 1.5rem; border-radius: 24px; max-height: 90vh; overflow-y: auto; border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }
  #confirmModal { z-index: 10000; }

  /* Navigation */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0.8rem; background: var(--bg); border-top: 2px solid var(--border); z-index: 50; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); cursor: pointer; }
  .nav-item.active { color: var(--primary); }
  
  /* Custom UI elements */
  .course-card { display: flex; gap: 1rem; padding: 1rem; border: 2px solid var(--border); border-radius: 16px; margin-bottom: 1rem; cursor: pointer; transition: 0.2s; background: var(--bg); box-shadow: 0 2px 0 var(--border); }
  .course-card:active { transform: translateY(2px); box-shadow: none; }
  .course-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; background: var(--primary); color: white; }
  .tag.free { background: #FFC800; color: #4B4B4B; }
  .tag.gray { background: var(--border); color: var(--text-muted); }

  .coin-pill { display: flex; align-items: center; gap: 6px; background: #FFD900; color: #4B4B4B; padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 0.9rem; cursor: pointer; }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner" style="width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;"></div>
  <div class="loader-bar-container"><div class="loader-fill" id="loaderFill"></div></div>
  <p style="margin-top:1rem;font-weight:800;color:var(--text);" id="loaderText">ခဏလေးပါနော်...</p>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <h1 style="color:var(--primary);margin-bottom:1.5rem;font-size:2rem;font-weight:800;display:flex;justify-content:center;align-items:center;gap:10px;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Myan Learn
    </h1>
    <div id="loginForm">
      <div class="input-group"><input id="loginUser" placeholder="Username" /></div>
      <div class="input-group">
        <input type="password" id="loginPass" placeholder="Password" />
      </div>
      <button class="btn" id="loginBtn" style="width:100%;margin-bottom:1rem;">SIGN IN</button>
      <p style="font-size:0.9rem;color:var(--text-muted);">No account? <a href="#" onclick="toggleAuth(true)" style="color:var(--primary);font-weight:800;">REGISTER</a></p>
    </div>
    <div id="registerForm" style="display:none;">
      <div class="input-group"><input id="regUser" placeholder="Username" /></div>
      <div class="input-group"><input type="password" id="regPass" placeholder="Password" /></div>
      <div class="input-group">
        <select id="regRole"><option value="student">Student</option><option value="teacher">Teacher</option></select>
      </div>
      <button class="btn" id="regBtn" style="width:100%;margin-bottom:1rem;">CREATE ACCOUNT</button>
      <p style="font-size:0.9rem;color:var(--text-muted);">Have an account? <a href="#" onclick="toggleAuth(false)" style="color:var(--primary);font-weight:800;">LOGIN</a></p>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="header">
    <h2 style="font-size:1.2rem;font-weight:800;color:var(--primary);">Myan Learn</h2>
    <div style="display:flex;gap:12px;align-items:center;">
      <div class="coin-pill" onclick="switchView('shop')">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.5h-3.2a1.8 1.8 0 0 0 0 3.6h1.4a1.8 1.8 0 0 1 0 3.6H9.5"/></svg>
        <span id="coinValue">0</span>
      </div>
      <div style="width:36px;height:36px;border-radius:50%;background:var(--border);display:flex;justify-content:center;align-items:center;cursor:pointer;" onclick="switchView('profile')">
        <span id="headerAvatar" style="font-weight:800;color:var(--text-muted);">U</span>
      </div>
    </div>
  </div>

  <!-- Views -->
  <div id="viewHome" class="app-view" style="display:none;">
    <h3 style="margin-bottom:1rem;font-weight:800;">My Courses</h3>
    <div id="myCourseList"></div>
  </div>

  <div id="viewTeachers" class="app-view" style="display:none;">
    <div id="teacherList"></div>
  </div>

  <!-- COURSE PATH VIEW -->
  <div id="viewPath" class="app-view" style="display:none; background:var(--surface);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:1rem; background:var(--bg); padding:10px; border-radius:12px; border:2px solid var(--border);">
      <button onclick="switchView('teachers')" style="background:none;border:none;cursor:pointer;color:var(--text);">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h3 id="pathTitle" style="font-weight:800;font-size:1.1rem;">Course Title</h3>
    </div>
    <div class="path-container" id="pathNodes"></div>
  </div>

  <!-- LESSON VIEWS -->
  <div id="viewLesson" class="app-view" style="display:none;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.5rem;">
      <button onclick="closeLesson()" style="background:none;border:none;cursor:pointer;color:var(--text);">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h3 id="lessonTitle" style="font-weight:800;font-size:1.2rem;flex:1;text-align:center;">Theory</h3>
      <div style="width:24px;"></div>
    </div>
    
    <!-- Progress -->
    <div style="width:100%;height:8px;background:var(--border);border-radius:4px;margin-bottom:1.5rem;">
      <div id="lessonProgress" style="width:50%;height:100%;background:var(--primary);border-radius:4px;"></div>
    </div>

    <div id="lessonContent"></div>

    <button class="btn" style="width:100%;margin-top:2rem;" onclick="completeCurrentLesson()">COMPLETE LESSON</button>
  </div>

  <div id="viewProfile" class="app-view" style="display:none;">
    <div style="text-align:center; padding:2rem 0;">
      <div style="width:100px;height:100px;border-radius:50%;background:var(--primary);color:white;display:flex;justify-content:center;align-items:center;font-size:2.5rem;font-weight:800;margin:0 auto 1rem;" id="profileAvatar">U</div>
      <h2 id="profileName" style="font-size:1.5rem;font-weight:800;">User</h2>
      <p style="color:var(--text-muted);" id="profileUsername">@user</p>
      <p id="profileSpecialty" style="color:var(--primary);font-weight:700;margin-top:0.5rem;"></p>
      
      <div style="display:flex;justify-content:center;gap:10px;margin-top:1.5rem;flex-wrap:wrap;">
        <button class="btn btn-glass" onclick="openEditProfile()">EDIT PROFILE</button>
        <button class="btn btn-glass" id="adminPanelBtn" onclick="openAdminPanel()" style="display:none;background:var(--primary);color:white;border-color:var(--primary-hover);">ADMIN PANEL</button>
        <button class="btn btn-glass" onclick="logout()" style="color:#FF4B4B;border-color:#FF4B4B;">LOGOUT</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchView('home')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Learn
    </div>
    <div class="nav-item" onclick="switchView('teachers')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Teachers
    </div>
    <div class="nav-item" id="navTeachMobile" style="display:none;" onclick="switchView('teach')">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Create
    </div>
    <div class="nav-item" onclick="switchView('profile')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Me
    </div>
  </div>
</div>

<!-- TEACHER CREATE COURSE (Modal) -->
<div class="modal" id="createCourseModal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;">
      <h3 style="font-weight:800;">Create Course</h3>
      <button onclick="closeModal('createCourseModal')" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted);">×</button>
    </div>
    <div class="input-group"><label>Title</label><input id="cTitle" /></div>
    <div class="input-group"><label>Description</label><textarea id="cDesc" rows="2"></textarea></div>
    <div class="input-group">
      <label>Cover Image URL</label>
      <input id="cCoverImg" placeholder="Drive Link / Image URL" />
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:1rem;">
      <input type="checkbox" id="cIsFree" onchange="document.getElementById('cPrice').disabled=this.checked" />
      <label for="cIsFree" style="font-weight:600;">Make it Free</label>
    </div>
    <div class="input-group"><label>Price (Coins)</label><input type="number" id="cPrice" placeholder="50" /></div>
    
    <h4 style="margin:1rem 0 0.5rem;font-weight:800;">Modules (Lessons)</h4>
    <div id="modulesContainer"></div>
    <button class="btn btn-glass" style="width:100%;margin-bottom:1rem;font-size:0.8rem;" onclick="addModuleInput()">+ Add Module</button>
    
    <button class="btn" style="width:100%;" onclick="publishCourse()">PUBLISH COURSE</button>
  </div>
</div>

<!-- MODULE MODAL -->
<div class="modal" id="moduleModal">
  <div class="modal-content">
    <h3 style="font-weight:800;margin-bottom:1rem;">Add Module</h3>
    <div class="input-group"><label>Module Title</label><input id="mTitle" placeholder="e.g. Introduction, Theory, Practice" /></div>
    <div class="input-group">
      <label>Module Type</label>
      <select id="mType">
        <option value="intro">Introduction (Article & Image)</option>
        <option value="theory">Theory (Vocabulary Flashcards)</option>
        <option value="practice">Practice</option>
      </select>
    </div>
    
    <div id="mIntroFields">
      <div class="input-group"><label>Article Image URL</label><input id="mImgUrl" placeholder="Google Drive Link" /></div>
      <div class="input-group"><label>Article Content (Text)</label><textarea id="mText" rows="4" placeholder="Write your explanation here..."></textarea></div>
    </div>
    
    <div id="mTheoryFields" style="display:none;">
      <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.5rem;">Format: Word | Romaji | Meaning (One per line)</p>
      <div class="input-group"><textarea id="mVocab" rows="4" placeholder="こんにちは | konnichiwa | Hello"></textarea></div>
    </div>

    <div class="input-group"><label>PDF File Link (Optional)</label><input id="mPdf" placeholder="https://drive.google.com/..." /></div>
    <div class="input-group"><label>Zoom Link (Optional)</label><input id="mZoom" placeholder="https://zoom.us/j/..." /></div>

    <button class="btn" style="width:100%;" onclick="saveModule()">ADD MODULE</button>
    <button class="btn btn-outline" style="width:100%;margin-top:0.5rem;" onclick="closeModal('moduleModal')">Cancel</button>
  </div>
</div>

<script>
  // --- CONFIG & STATE ---
  const API_URL = '/api/index.js';
  const State = { 
    user: null, teachers: [], myCourses: [], packages: [], settings: {},
    currentCourse: null, currentModule: null, hasAccess: false,
    pendingModules: [], // For teacher creation
    postImgUrl: '', proofImgUrl: '', selectedPkg: null
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return s ? String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : ''; }
  function imgUrl(u) {
    if(!u) return '';
    if(u.includes('drive.google.com/file/d/')) return `https://lh3.googleusercontent.com/d/${u.split('/d/')[1].split('/')[0]}=w1000`;
    return u;
  }
  
  async function api(action, body = {}) {
    body.action = action;
    const res = await fetch(API_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    return await res.json();
  }
  
  function toast(msg) {
    const t = document.createElement('div');
    t.style = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:white;padding:12px 24px;border-radius:12px;font-size:0.9rem;z-index:9999;font-weight:800;box-shadow:0 4px 0 var(--primary-hover);';
    t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
  }

  let loadInt;
  function showLoading() {
    $('loadingOverlay').classList.add('show');
    let w = 0; $('loaderFill').style.width = '0%';
    loadInt = setInterval(() => { w += Math.random() * 15; if(w > 90) w = 90; $('loaderFill').style.width = w + '%'; }, 200);
  }
  function hideLoading() {
    clearInterval(loadInt); $('loaderFill').style.width = '100%';
    setTimeout(() => { $('loadingOverlay').classList.remove('show'); }, 300);
  }

  // AUTH
  function toggleAuth(isReg) { $('loginForm').style.display = isReg ? 'none' : 'block'; $('registerForm').style.display = isReg ? 'block' : 'none'; }
  
  $('loginBtn').onclick = async () => {
    showLoading();
    const r = await api('login', { username: $('loginUser').value, password: $('loginPass').value });
    hideLoading();
    if (r.success) { State.user = r.user; initApp(); } else toast(r.error);
  };
  
  $('regBtn').onclick = async () => {
    showLoading();
    const role = $('regRole').value;
    const r = await api('register', { username: $('regUser').value, password: $('regPass').value, role });
    hideLoading();
    if (r.success) { 
      State.user = r.user; initApp(); 
      if(role === 'teacher') toast('Teacher အကောင့်အတွက် Admin Approve စောင့်ပါ'); 
    } else toast(r.error);
  };

  // INIT
  async function initApp() {
    $('authScreen').style.display = 'none';
    $('app').style.display = 'flex';
    localStorage.setItem('ml_user', JSON.stringify(State.user));
    await loadData();
    switchView('home');
  }

  async function loadData() {
    showLoading();
    const r = await api('bootstrap', { username: State.user.username });
    State.user = r.user;
    const tr = await api('getTeachers'); State.teachers = tr.teachers;
    hideLoading();
    
    $('headerAvatar').innerText = State.user.displayName.charAt(0).toUpperCase();
    $('profileAvatar').innerText = State.user.displayName.charAt(0).toUpperCase();
    $('coinValue').innerText = State.user.coins;
    $('profileName').innerText = State.user.displayName;
    $('profileUsername').innerText = '@' + State.user.username;
    $('profileSpecialty').innerText = State.user.specialty || '';
    
    if (State.user.isAdmin) {
      $('adminPanelBtn').style.display = 'inline-flex';
      $('navTeachMobile').style.display = 'flex';
    } else if (State.user.role === 'teacher') {
      $('navTeachMobile').style.display = 'flex';
    }

    // Render My Courses
    const allCourses = await api('getTeacherCourses', { teacherId: 'all' }); // simplified for now
    // In a real app, you'd fetch courses the user bought. We'll show teachers for now.
  }

  // VIEWS
  function switchView(v) {
    ['home','teachers','path','lesson','profile','teach'].forEach(x => {
      const el = $('view' + x.charAt(0).toUpperCase() + x.slice(1));
      if(el) el.style.display = 'none';
    });
    if(v === 'home') { $('viewHome').style.display = 'block'; renderHome(); }
    if(v === 'teachers') { $('viewTeachers').style.display = 'block'; renderTeachers(); }
    if(v === 'profile') { $('viewProfile').style.display = 'block'; }
    if(v === 'teach') { openModal('createCourseModal'); }
    
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if(event && event.currentTarget) event.currentTarget.classList.add('active');
  }

  function closeModal(id) { $(id).classList.remove('open'); }
  function openModal(id) { $(id).classList.add('open'); }

  // RENDER HOME & TEACHERS
  function renderHome() {
    $('myCourseList').innerHTML = `
      <div class="course-card" onclick="switchView('teachers')">
        <div style="width:80px;height:80px;background:var(--primary-light);border-radius:12px;display:flex;justify-content:center;align-items:center;color:white;">
          <svg class="icon" viewBox="0 0 24 24" style="width:40px;height:40px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div>
          <h4 style="font-weight:800;font-size:1.1rem;">Explore Teachers</h4>
          <p style="font-size:0.85rem;color:var(--text-muted);margin-top:4px;">Find courses and start learning today.</p>
        </div>
      </div>
    `;
  }

  function renderTeachers() {
    const c = $('teacherList');
    if (!State.teachers.length) { c.innerHTML = '<p style="text-align:center;margin-top:2rem;color:var(--text-muted);">No teachers yet.</p>'; return; }
    c.innerHTML = State.teachers.map(t => `
      <div class="course-card" onclick="openTeacherProfile('${t.username}')">
        <img src="${imgUrl(t.profileImage) || 'https://via.placeholder.com/80'}" class="course-img" />
        <div style="flex:1;">
          <h4 style="font-weight:800;font-size:1.1rem;">${esc(t.displayName)}</h4>
          <p style="font-size:0.85rem;color:var(--text-muted);margin-top:2px;">${esc(t.specialty || 'Teacher')}</p>
          <div style="margin-top:6px;"><span class="tag">⭐ ${(t.rating || 0).toFixed(1)}</span></div>
        </div>
      </div>
    `).join('');
  }

  // TEACHER PROFILE -> COURSE PATH
  async function openTeacherProfile(username) {
    State.currentTeacher = State.teachers.find(x => x.username === username);
    showLoading();
    const r = await api('getTeacherCourses', { teacherId: username });
    hideLoading();
    
    if(r.courses.length === 0) return toast('ဒီဆရာ့ဆီမှာ သင်ခန်းစာ မရှိသေးပါ');
    
    // Open first course directly
    openCoursePath(r.courses[0].id);
  }

  async function openCoursePath(courseId) {
    showLoading();
    const r = await api('getCourseDetails', { courseId, username: State.user.username });
    hideLoading();
    if(!r.success) return toast('Error loading course');
    
    State.currentCourse = r.course;
    State.hasAccess = r.hasAccess;
    State.user.completedLessons = r.completedLessons;
    
    $('pathTitle').innerText = r.course.title;
    
    if(!State.hasAccess) {
      $('pathNodes').innerHTML = `
        <div style="text-align:center;padding:2rem;">
          <svg class="icon" viewBox="0 0 24 24" style="width:60px;height:60px;color:#FF4B4B;margin-bottom:1rem;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <h3 style="font-weight:800;">Unlock this course</h3>
          <p style="color:var(--text-muted);margin-bottom:1rem;">Coins ${r.course.price} လိုအပ်ပါသည်။</p>
          <button class="btn" onclick="buyCourse('${r.course.id}')">UNLOCK FOR ${r.course.price} COINS</button>
        </div>
      `;
      switchView('path');
      return;
    }

    let html = '';
    r.course.modules.forEach((m, i) => {
      const isCompleted = State.user.completedLessons.includes(m.id);
      const typeClass = (m.type === 'intro' || m.type === 'theory') ? 'active' : 'diamond';
      const icon = m.type === 'intro' ? '📖' : (m.type === 'theory' ? '📝' : '🎤');
      
      html += `
        <div class="path-node ${typeClass}" onclick="openLesson('${m.id}')">
          <span style="font-size:1.5rem;">${icon}</span>
          <div class="node-label">${esc(m.title)}</div>
        </div>
        ${i < r.course.modules.length - 1 ? '<div class="path-line"></div>' : ''}
      `;
    });
    $('pathNodes').innerHTML = html;
    switchView('path');
  }

  async function buyCourse(id) {
    if(!confirm(`Coins ${State.currentCourse.price} ဖြင့် ဝယ်ယူမှာလား?`)) return;
    showLoading();
    const r = await api('buyCourse', { username: State.user.username, courseId: id });
    hideLoading();
    if(r.success) { toast('ဝယ်ယူပြီးပါပြီ!'); await loadData(); openCoursePath(id); }
    else toast(r.error);
  }

  // LESSON VIEWER
  function openLesson(moduleId) {
    const m = State.currentCourse.modules.find(x => x.id === moduleId);
    if(!m) return;
    State.currentModule = m;
    
    $('lessonTitle').innerText = m.title;
    $('lessonProgress').style.width = '100%';
    
    let contentHtml = '';
    if (m.type === 'intro') {
      contentHtml = `
        <div class="intro-card">
          <h2 class="intro-title">${esc(m.title)}</h2>
          ${m.imageUrl ? `<img src="${imgUrl(m.imageUrl)}" class="intro-img" />` : ''}
          <div class="intro-text">${esc(m.text).replace(/\n/g, '<br>')}</div>
        </div>
      `;
    } else if (m.type === 'theory') {
      contentHtml = `
        <div class="theory-container">
          <h3 style="font-weight:800;margin-bottom:1rem;color:var(--text-muted);">👉 Vocabulary you'll learn</h3>
          ${m.vocab.map(v => `
            <div class="flashcard">
              <div class="fc-header">
                <div>
                  <span class="fc-word">${esc(v.word)}</span>
                  <span class="fc-romaji">(${esc(v.romaji)})</span>
                </div>
                <div class="fc-actions">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                  <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                </div>
              </div>
              <div class="fc-meaning">${esc(v.meaning)}</div>
              <div class="fc-note">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Add note
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Append PDF & Zoom Links if exist
    if (m.pdfUrl || m.zoomUrl) {
      contentHtml += `<div style="margin-top:2rem; display:flex; flex-direction:column; gap:10px;">`;
      if (m.pdfUrl) contentHtml += `<a href="${m.pdfUrl}" target="_blank" class="btn btn-glass" style="color:#FF9600; border-color:#FF9600;">📄 DOWNLOAD PDF NOTES</a>`;
      if (m.zoomUrl) contentHtml += `<a href="${m.zoomUrl}" target="_blank" class="btn btn-glass" style="color:#1CB0F6; border-color:#1CB0F6;">🎥 JOIN ZOOM MEETING</a>`;
      contentHtml += `</div>`;
    }

    $('lessonContent').innerHTML = contentHtml;
    switchView('lesson');
  }

  function closeLesson() { switchView('path'); }
  
  async function completeCurrentLesson() {
    showLoading();
    await api('completeLesson', { username: State.user.username, lessonId: State.currentModule.id });
    hideLoading();
    toast('Lesson Completed! 🎉');
    openCoursePath(State.currentCourse.id); // reload path
  }

  // --- TEACHER COURSE CREATION ---
  function addModuleInput() { openModal('moduleModal'); }

  function saveModule() {
    const type = $('mType').value;
    const title = $('mTitle').value || 'Untitled';
    
    let vocabArr = [];
    if(type === 'theory') {
      vocabArr = $('mVocab').value.split('\n').filter(l => l.trim()).map(l => {
        const parts = l.split('|');
        return { word: parts[0]?.trim() || '', romaji: parts[1]?.trim() || '', meaning: parts[2]?.trim() || '' };
      });
    }

    State.pendingModules.push({
      id: 'm_' + Date.now() + Math.random().toString(36).substr(2, 5),
      type, title,
      imageUrl: $('mImgUrl').value,
      text: $('mText').value,
      vocab: vocabArr,
      pdfUrl: $('mPdf').value,
      zoomUrl: $('mZoom').value
    });

    renderPendingModules();
    closeModal('moduleModal');
    
    // clear inputs
    $('mTitle').value = ''; $('mImgUrl').value = ''; $('mText').value = ''; $('mVocab').value = ''; $('mPdf').value = ''; $('mZoom').value = '';
  }

  function renderPendingModules() {
    $('modulesContainer').innerHTML = State.pendingModules.map((m, i) => `
      <div style="padding:10px;border:2px solid var(--border);border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <div><b>${i+1}. ${esc(m.title)}</b> <span class="tag gray" style="font-size:0.6rem;">${m.type}</span></div>
        <button onclick="State.pendingModules.splice(${i},1); renderPendingModules();" style="background:none;border:none;color:#FF4B4B;cursor:pointer;">✕</button>
      </div>
    `).join('');
  }

  // Update module modal fields based on type
  $('mType').onchange = (e) => {
    if(e.target.value === 'intro') {
      $('mIntroFields').style.display = 'block';
      $('mTheoryFields').style.display = 'none';
    } else if(e.target.value === 'theory') {
      $('mIntroFields').style.display = 'none';
      $('mTheoryFields').style.display = 'block';
    } else {
      $('mIntroFields').style.display = 'none';
      $('mTheoryFields').style.display = 'none';
    }
  };

  async function publishCourse() {
    const isFree = $('cIsFree').checked;
    const price = isFree ? 0 : Number($('cPrice').value);
    if(!$('cTitle').value) return toast('ခေါင်းစဉ် ထည့်ပါ');
    
    showLoading();
    await api('createCourse', {
      username: State.user.username, 
      title: $('cTitle').value, 
      description: $('cDesc').value,
      coverImage: $('cCoverImg').value,
      isFree, price,
      modules: State.pendingModules
    });
    hideLoading();
    toast('သင်ခန်းစာ တင်ပြီးပါပြီ!');
    closeModal('createCourseModal');
    State.pendingModules = []; $('modulesContainer').innerHTML = '';
    switchView('home');
  }

  function logout() { localStorage.removeItem('ml_user'); location.reload(); }

  // INIT
  const saved = localStorage.getItem('ml_user');
  if (saved) { State.user = JSON.parse(saved); initApp(); }
</script>
</body>
</html>
